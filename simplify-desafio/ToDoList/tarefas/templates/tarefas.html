<div class="container text-center">
  <div class="row align-items-start">
    {% for c in categorias %}
      <div class="col">
        <h3 class="mb-3">{{ c.nome }}</h3>

        {% for t in tarefas %}
          {# Compara o ID da Foreign Key com o ID da Categoria #}
          {% if t.prioridade_id == c.id %}
            <div class="card mb-3 mx-auto" style="max-width: 320px;">
              <div class="card-body">
                <h4 class="card-title">{{ t.nome }}</h4>
                <p class="card-text">{{ t.descricao }}</p>
              </div>
            </div>
          {% endif %}
        {% empty %}
          <p class="text-muted">Não possuímos tarefas</p>
        {% endfor %}

      </div>
    {% empty %}
      <p class="text-muted">Não possui categorias</p>
    {% endfor %}
  </div>
</div>
