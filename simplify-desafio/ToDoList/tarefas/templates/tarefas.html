
<div class="card" style="width: 18rem;">
  <ul class="list-group list-group-flush">
    {% for c in categorias %}
    <ul class="list-group ">
      {{ c.nome }}

      {% for t in tarefas %}
        <li class="list-group-item"> {{ t.nome }}</li>
        {% empty %}
        <li> Nenhuma tarefa</li>
      {% endfor %}
    {% empty %}
    <li class="list-group-item">Nenhuma categoria</li>
    {% endfor %}
    </ul>
  </ul>
</div>
